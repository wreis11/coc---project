<!doctype html>
<html lang="pt-pt">
  <!-- Página de autenticação do site -->
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | College of Computing</title>
    <link rel="stylesheet" href="../css/estilo.css" />
  </head>

  <body>
    <!-- Cabeçalho comum a todas as páginas internas -->
    <header class="barra">
      <a href="../index.html">
        <h1 class="co">COLLEGE OF COMPUTING</h1>
      </a>
      <a href="saber.html" aria-label="Mais informações">
        <img src="../imgs/iconis/info.png" alt="" class="ajuda" />
      </a>
    </header>

    <!-- Conteúdo principal da página -->
    <main>
      <!-- Formulário de login -->
      <form>
        <div class="bai">
          <h1>Conecta-se</h1>
          <label class="wesley" for="email">E-mail ou número do telefone:</label>
          <input id="email" type="text" required placeholder="E-mail ou número do telefone" />
          <label class="wesley" for="password">Palavra-passe:</label>
          <input id="password" type="password" required placeholder="Palavra-passe" />
          <input type="submit" value="Entrar" class="oi" />
          <label class="aroz">
            Esqueceu da
            <a href="#" target="_self" rel="next">palavra-passe?</a>
          </label>
        </div>
      </form>
    </main>
  </body>
</html>
